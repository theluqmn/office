{{define "header"}}
<header class="w-full md:w-3/5 mx-auto flex flex-col gap-1">
    <div class="flex flex-row justify-between">
        <p class="text-amber font-bold">Luqman's Office</p>
        <p class="text-amber text-right">@theluqmn</p>
    </div>
    
    <div class="flex flex-row justify-between text-sm text-center">
        <div class="flex flex-row gap-4 text-amber">
            <a href="/"
            class="flex flex-row gap-2 items-center hover:bg-[rgba(71,85,105,0.2)] duration-300">
                <p id="nav-home-key" class="bg-amber-solid text-black w-4 h-4 leading-4">1</p>
                <p id="nav-home-text">Home</p>
            </a>

            <a href="/projects"
            class="flex flex-row gap-2 items-center hover:bg-[rgba(71,85,105,0.2)] duration-300">
                <p id="nav-projects-key" class="bg-amber-solid text-black w-4 h-4 leading-4">2</p>
                <p id="nav-projects-text">Projects</p>
            </a>

            <a href="/journal"
            class="flex flex-row gap-2 items-center hover:bg-[rgba(71,85,105,0.2)] duration-300">
                <p id="nav-journal-key" class="bg-amber-solid text-black w-4 h-4 leading-4">3</p>
                <p id="nav-journal-text">Journal</p>
            </a>
        </div>

        <a href="https://github.com/theluqmn/office"
        class="hidden md:flex flex-row gap-2 items-center hover:bg-[rgba(71,85,105,0.2)] duration-300">
            <p id="nav-repo-key" class="bg-amber-solid text-black w-4 h-4 leading-4">0</p>
            <p id="nav-repo-text" class="text-amber">GitHub Repository</p>
        </a>
    </div>

    {{template "split" .}}

    <script src="/static/js/header.js"></script>
</header>
{{end}}
