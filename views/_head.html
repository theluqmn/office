{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="static/pfp.jpg" type="image/x-icon" />

<title>Luqman's Office - {{.Title}}</title>

<meta property="og:title" content="Luqman's Office - {{.Title}}" />
<meta property="og:description" content="{{.Description}}" />
<meta property="og:type" content="website" />

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['"IBM Plex Mono"', 'monospace'] } } } }</script>

<style>
@layer utilities {
    .vignette-glow {
        box-shadow: inset 0 0 50px rgba(255, 176, 0, 0.1);
    }
    
    .scanlines::before {
        content: " ";
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 10;
        background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%);
        background-size: 100% 2px;
    }

    .img-amber {
        filter: grayscale(100%) sepia(100%) hue-rotate(330deg) saturate(800%) contrast(1.3);
        border: 1px solid #ffb000; box-shadow: 0 0 10px rgba(255, 176, 0, 0.5);
    }

    .text-amber         { color: #ffb000; filter: drop-shadow(0 0 6px rgba(255,176,0,0.6)); }
    .text-dim           { color: #475569; filter: none; }
    
    .bg-amber           { background-color: rgba(255,176,0,0.15); }
    .bg-dim             { background-color: rgba(71,85,105,0.2); }
    
    .bg-amber-solid     { background-color: #ffb000; color: #000; }
    
    .border-amber       { border: 1px solid #ffb000; box-shadow: 0 0 0 2px rgba(255,176,0,0.3),inset 0 0 0 1px rgba(255,176,0,0.2); }
    .border-dim         { border: 1px solid #475569; box-shadow: 0 0 0 2px rgba(50,50,50,0.3),inset 0 0 0 1px rgba(50,50,50, 0.2); }
}
</style>
{{end}}
